name: Archive Tumblr (simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Questo pezzetto serve per superare il blocco del Google Authenticator
    permissions:
      contents: write

    # Questo toglie l'errore giallo di Node.js 20 che vedevi prima
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Download Tumblr
        run: |
          mkdir -p backup
          wget -r -np -k -E -p -P backup https://aasastroblog.tumblr.com/

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "backup $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push
