name: Sync Tumblr

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tumblr-utils
        run: |
          python -m pip install --upgrade pip
          pip install tumblr-utils

      - name: Backup Tumblr
        env:
          TUMBLR_API_KEY: ${{ secrets.TUMBLR_API_KEY }}
        run: |
          mkdir -p backup
          python -m tumblr_backup aasastroblog.tumblr.com backup --api-key $TUMBLR_API_KEY

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "update" || echo "no changes"
          git push
