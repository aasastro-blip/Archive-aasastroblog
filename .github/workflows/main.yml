name: Sync Tumblr

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tumblr-utils
        run: |
          python -m pip install --upgrade pip
          pip install tumblr-utils

      - name: Backup Tumblr
        run: |
          tumblr-backup aasastroblog.tumblr.com

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "update" || echo "no changes"
          git push
