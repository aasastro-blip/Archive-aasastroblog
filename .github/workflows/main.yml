name: Archive Tumblr (simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Tumblr
        run: |
          mkdir -p backup
          # Usiamo dei "trucchi" per non farci bloccare da Tumblr (User-Agent e Wait)
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               -r -np -k -E -p -nc -P backup https://aasastroblog.tumblr.com/ || echo "Alcuni file saltati, procedo comunque"

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          # Evitiamo che il processo fallisca se non ci sono novità
          git commit -m "backup $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
