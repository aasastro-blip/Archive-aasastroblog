name: Sync Tumblr

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install tumblr-utils
        run: pip install tumblr-utils

      - name: Backup Tumblr
        run: tumblr_backup aasastroblog.tumblr.com

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "update" || echo "no changes"
          git push
