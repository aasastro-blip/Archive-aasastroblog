name: Archive Tumblr (simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Tumblr
        run: |
          mkdir -p backup
          wget -r -np -k -E -p -P backup https://aasastroblog.tumblr.com/

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "backup" || echo "no changes"
          git push
