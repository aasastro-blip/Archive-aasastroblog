name: Backup Tumblr

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        run: |
          mkdir -p backup
          curl -L "https://aasastroblog.tumblr.com/" -o backup/index.html
          echo "aasastro.com" > CNAME

      - name: Save
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compari cartella backup!" || exit 0
          git push origin main
